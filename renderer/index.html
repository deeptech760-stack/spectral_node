<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPECTRAL NODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/2.12.0/tsparticles.bundle.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="canvas.js"></script>
</head>
<body>
  <img id="bg" src="../pcb33.png" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: 0;">
  <canvas id="bokeh-layer" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;"></canvas>
  <div id="app" style="z-index: 10;">
    <div class="titlebar">
      <div class="titlebar-title">SPECTRAL NODE v1.0</div>
      <div class="titlebar-controls">
        <button class="titlebar-btn" id="btn-minimize" title="Minimize">─</button>
        <button class="titlebar-btn close" id="btn-close" title="Close">✕</button>
      </div>
    </div>
    
    <div class="main-content">
      <canvas id="circuit-canvas"></canvas>
      
      <div class="nodes-layer" id="nodes-layer"></div>
      
      <div class="particles-container" id="particles-container">
        <canvas id="tsparticles"></canvas>
      </div>
    </div>
  </div>
  
  <script src="canvas.js"></script>
<script src="renderer.js"></script>
</body>
</html>
